# For hyprland.conf, which Hyprland is retiring. athanor.lua is the current one.

$athanor = ~/.local/bin/athanor
$athanor_home = ~/.config/athanor
$terminal = foot --config $athanor_home/current/foot/foot.ini
$launcher = fuzzel --config $athanor_home/current/fuzzel/fuzzel.ini
$mod = SUPER

monitor = , preferred, auto, 1

exec-once = $athanor wake
exec-once = $athanor stages --follow
exec-once = waybar --config $athanor_home/waybar/config.jsonc --style $athanor_home/current/waybar/style.css
exec-once = mako --config $athanor_home/current/mako/config
exec-once = hypridle --config $athanor_home/hypr/hypridle.conf

env = XCURSOR_THEME, athanor
env = XCURSOR_SIZE, 24

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

input {
    kb_layout = us
    follow_mouse = 1
}

source = ~/.config/athanor/current/hypr/colors.conf
