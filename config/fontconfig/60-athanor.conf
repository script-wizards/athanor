<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- These faces only cover code page 437. Fill the gaps from IBM VGA, which has
     the same 8x16 grid, rather than a proportional font. -->
<fontconfig>
  <alias binding="strong">
    <family>Px437 Tandy2K</family>
    <prefer>
      <family>Px437 Tandy2K</family>
      <family>PxPlus IBM VGA 8x16</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Px437 AT&amp;T PC6300</family>
    <prefer>
      <family>Px437 AT&amp;T PC6300</family>
      <family>PxPlus IBM VGA 8x16</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Px437 CompaqThin 8x16</family>
    <prefer>
      <family>Px437 CompaqThin 8x16</family>
      <family>PxPlus IBM VGA 8x16</family>
    </prefer>
  </alias>
  <!-- The Px437 and PxPlus faces are traced bitmaps. At 16px every edge
       lands on a pixel. Antialiasing only adds grey. Subpixel rendering adds
       colored fringes. Without either they draw as the original bitmaps. -->
  <match target="font">
    <test name="family" compare="contains"><string>Px437 </string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>PxPlus </string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
