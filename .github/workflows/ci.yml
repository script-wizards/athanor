name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      # zsh, or the ZDOTDIR installer test skips.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends zsh shellcheck
      - if: runner.os == 'macOS'
        run: brew install shellcheck
      - run: uv run --frozen pytest -q
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen ruff format --check src tests
      - run: shellcheck install.sh docs/screenshots/shoot.sh docs/screenshots/palette.sh
