# Generated by athanor transmute ({{ label }}). Edits are overwritten.
include=~/.config/athanor/current/foot/colors.ini
font={{ term_font }}:pixelsize={{ term_px }},Symbols Nerd Font Mono:pixelsize={{ term_icon_px }}:antialias=false:rgba=none
font-bold={{ term_font_bold }},Symbols Nerd Font Mono:pixelsize={{ term_icon_px }}:antialias=false:rgba=none
font-italic={{ term_font_italic }},Symbols Nerd Font Mono:pixelsize={{ term_icon_px }}:antialias=false:rgba=none
font-bold-italic={{ term_font_bold }},Symbols Nerd Font Mono:pixelsize={{ term_icon_px }}:antialias=false:rgba=none
pad=14x14

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes
